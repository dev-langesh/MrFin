version: '3.8'

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fman-api
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - MONGODB_URI=mongodb://mongo:27017/fman
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./server/.env
    depends_on:
      - mongo
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - default

  mongo:
    image: mongo:latest
    container_name: fman-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - default
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: fman-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - default
    restart: unless-stopped

  prometheus:
    build:
      context: ./prometheus
      dockerfile: Dockerfile
    container_name: prometheus
    image: prometheus
    ports:
      - "9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "9093:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - default
    restart: unless-stopped

volumes:
  prometheus_data:
    name: prometheus_data
  grafana_data:
    name: grafana_data
  mongo_data:
    name: mongo_data
  redis_data:
    name: redis_data

networks:
  default:
    name: MrFin
    driver: bridge

